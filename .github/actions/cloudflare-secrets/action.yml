name: Cloudflare secrets
description: >-
  Fails fast when this repository's own Cloudflare secrets are absent, so a
  deploy, preview, or rollback never reaches Cloudflare without them.
runs:
  using: composite
  steps:
    - name: Check the Cloudflare secrets are set
      shell: bash
      run: |
        missing=0
        for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
          if [ -z "${!name:-}" ]; then
            echo "::error::Repository secret ${name} is not set. This workflow deploys to your own Cloudflare account: add ${name} under Settings > Secrets and variables > Actions."
            missing=1
          fi
        done
        exit "$missing"
