name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  deploy:
    name: preview · deploy and journeys
    if: ${{ !github.event.repository.is_template && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ALCHEMY_STAGE: pr-${{ github.event.pull_request.number }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/cloudflare-secrets
      - uses: ./.github/actions/dev-shell
      - name: Deploy the preview
        run: nix develop --command pnpm run deploy
      - name: Read the preview URL
        id: site
        run: |
          state="$(nix develop --command ./bin/cloud pnpm --filter @endgame/site exec alchemy state cat --backend cloudflare "Endgame/${ALCHEMY_STAGE}/output" | sed -n '/^{/,$p')"
          echo "url=$(jq -er '.url' <<<"$state")" >> "$GITHUB_OUTPUT"
      - name: Comment on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SITE_URL: ${{ steps.site.outputs.url }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          body="$(printf '### Preview %s\n\n%s\n\n[Preview run](%s/%s/actions/runs/%s)\n' \
            "$ALCHEMY_STAGE" "$SITE_URL" "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}")"
          gh pr comment "$PR" --edit-last --create-if-none --body "$body"
      - name: Deployed journeys
        env:
          SITE_URL: ${{ steps.site.outputs.url }}
        run: nix develop --command pnpm journeys:deployed
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: preview-artifacts
          path: apps/site-e2e/artifacts/
          if-no-files-found: ignore

  destroy:
    name: preview · destroy
    if: ${{ !github.event.repository.is_template && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ALCHEMY_STAGE: pr-${{ github.event.pull_request.number }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/cloudflare-secrets
      - uses: ./.github/actions/dev-shell
      - name: Destroy the preview
        run: nix develop --command pnpm run destroy
