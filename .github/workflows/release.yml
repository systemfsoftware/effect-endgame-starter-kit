name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  plan:
    name: plan · derive phase
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      phase: ${{ steps.plan.outputs.phase }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: ./.github/actions/dev-shell
      - name: Preflight intent consumption
        run: nix develop --command sandbox -- pnpm version -r --dry-run
      - id: plan
        name: Decide release phase from repository state
        run: |
          nix develop --command sandbox --allow-host jsr.io -- ./scripts/plan-release.ts --output .cache/plan-release.out
          cat .cache/plan-release.out >> "$GITHUB_OUTPUT"

  version:
    if: needs.plan.outputs.phase == 'version'
    needs: [plan]
    name: version · open release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/dev-shell
      - name: Consume pending change intents
        run: nix develop --command sandbox -- pnpm version -r
      - name: Capture release set
        run: |
          nix develop --command sandbox --allow-host jsr.io -- ./scripts/tag-released-packages.ts --dry-run --json --output .cache/captured.json
          cat .cache/captured.json
      - name: Assert release notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          nix develop --command sandbox --allow-host jsr.io --allow-host api.github.com
          --pass-env GITHUB_TOKEN --pass-env GITHUB_REPOSITORY
          -- ./scripts/create-github-releases.ts --assert --captured .cache/captured.json
      - name: Open or update the Release PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: changeset-release/main
          BASE: ${{ github.event.repository.default_branch }}
        run: nix develop --command ./scripts/open-release-pr.sh

  release:
    if: needs.plan.outputs.phase == 'release'
    permissions:
      contents: write
    name: release · tag
    needs: [plan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: ./.github/actions/dev-shell
      - name: Capture release set
        run: nix develop --command sandbox --allow-host jsr.io -- ./scripts/tag-released-packages.ts --dry-run --json --output .cache/captured.json
      - name: Assert release notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          nix develop --command sandbox --allow-host jsr.io --allow-host api.github.com
          --pass-env GITHUB_TOKEN --pass-env GITHUB_REPOSITORY
          -- ./scripts/create-github-releases.ts --assert --captured .cache/captured.json
      - name: Tag released versions
        run: nix develop --command sandbox --allow-host jsr.io --allow-host github.com -- ./scripts/tag-released-packages.ts --captured .cache/captured.json
      - name: GitHub Releases from authored changelogs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          nix develop --command sandbox --allow-host jsr.io --allow-host api.github.com
          --pass-env GITHUB_TOKEN --pass-env GITHUB_REPOSITORY
          -- ./scripts/create-github-releases.ts --captured .cache/captured.json
