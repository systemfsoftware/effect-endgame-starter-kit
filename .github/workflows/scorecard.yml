name: Scorecard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      pull-requests: write
    outputs:
      mode: ${{ steps.instrument.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: instrument
        name: Choose the instrument that grades this run
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            printf 'ref=%s\nmode=base\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          selector=evals/ratstack-scorecard/ci/instrument-ref.sh
          if git cat-file -e "$BASE:$selector" 2>/dev/null; then
            git show "$BASE:$selector" | bash -s -- "$BASE" "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            bash "$selector" "$BASE" "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.instrument.outputs.ref }}
          path: .scorecard-instrument
          persist-credentials: false
      - name: "BOOTSTRAP: self-graded, base had no instrument"
        if: steps.instrument.outputs.mode == 'bootstrap'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          banner="# ⚠️ BOOTSTRAP: SELF-GRADED, BASE HAD NO INSTRUMENT

          The base commit has no \`.github/workflows/scorecard.yml\`, so this run grades the pull request with its own instrument. Every later pull request is graded by its base's instrument."
          printf '%s\n\n' "$banner" >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR" --body "$banner"
      - uses: cachix/install-nix-action@v31
      - name: Allow the launcher's unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build the grading instrument
        run: echo "SCORECARD=$(nix build --no-link --print-out-paths ./.scorecard-instrument/evals/ratstack-scorecard#scorecard)/bin/scorecard" >> "$GITHUB_ENV"
      - name: Restore rat-stack results
        uses: actions/cache/restore@v6
        with:
          path: .scorecard-cache
          key: scorecard-ratstack-${{ github.run_id }}
          restore-keys: scorecard-ratstack-
      - name: Measure, judge, ratchet and publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"$SCORECARD" ci --checkout "$GITHUB_WORKSPACE" --cache .scorecard-cache --out scorecard-out'
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: scorecard
          path: scorecard-out/scorecard.json
          if-no-files-found: error
      - name: Save rat-stack results
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        uses: actions/cache/save@v6
        with:
          path: .scorecard-cache
          key: scorecard-ratstack-${{ github.run_id }}

  instrument-preview:
    name: instrument preview (informational)
    needs: scorecard
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.scorecard.outputs.mode == 'base' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: changed
        name: Does this PR edit the instrument
        run: |
          if git diff --quiet "${{ github.event.pull_request.base.sha }}" HEAD -- evals/ratstack-scorecard; then
            echo "edits=false" >> "$GITHUB_OUTPUT"
            echo "This PR leaves the instrument alone; nothing to preview." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "edits=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: cachix/install-nix-action@v31
        if: steps.changed.outputs.edits == 'true'
      - name: Allow the launcher's unprivileged user namespaces
        if: steps.changed.outputs.edits == 'true'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/download-artifact@v8
        if: steps.changed.outputs.edits == 'true'
        with:
          name: scorecard
          path: graded
      - name: Grade with this PR's own instrument against the graded scorecard
        if: steps.changed.outputs.edits == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          scorecard="$(nix build --no-link --print-out-paths ./evals/ratstack-scorecard#scorecard)/bin/scorecard"
          "$scorecard" ci --checkout "$GITHUB_WORKSPACE" --cache .scorecard-cache --out preview \
            --main graded/scorecard.json --title "Instrument preview (does not gate)"

  pin:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Allow the launcher's unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build the instrument
        run: echo "SCORECARD=$(nix build --no-link --print-out-paths ./evals/ratstack-scorecard#scorecard)/bin/scorecard" >> "$GITHUB_ENV"
      - id: check
        name: Compare the pin with rat-stack main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          plan="$("$SCORECARD" pin check)"
          echo "$plan" | jq .
          echo "tag=$(jq -r ._tag <<<"$plan")" >> "$GITHUB_OUTPUT"
          echo "to=$(jq -r '.to // empty' <<<"$plan")" >> "$GITHUB_OUTPUT"
          echo "Pin: $(jq -r 'if ._tag == "PinCurrent" then "pin current at \(.commit)" else "rat-stack moved \(.from) -> \(.to)" end' <<<"$plan")" >> "$GITHUB_STEP_SUMMARY"
      - id: token
        if: steps.check.outputs.tag == 'PinMoved'
        name: Pin-bump app token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.SCORECARD_APP_ID }}
          private-key: ${{ secrets.SCORECARD_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      # scorecard/pin-rat-stack is bot-owned: the job only ever replaces a tip the bot
      # itself wrote, through a lease pinned to that tip, so a human commit there is
      # never overwritten. The App token reaches git through a credential helper that
      # reads it from the environment, never through argv or a URL.
      - name: Open or update the pin-bump PR
        if: steps.check.outputs.tag == 'PinMoved'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TO: ${{ steps.check.outputs.to }}
          BRANCH: scorecard/pin-rat-stack
          BOT_EMAIL: scorecard-pin[bot]@users.noreply.github.com
        run: |
          git config credential.helper "!f() { echo username=x-access-token; echo \"password=\${GH_TOKEN}\"; }; f"
          nar_hash="$(nix flake prefetch --json "github:joelhooks/rat-stack/$TO" | jq -r .hash)"
          "$SCORECARD" pin write --commit "$TO" --nar-hash "$nar_hash"
          lease="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          if [ -n "$lease" ]; then
            git fetch --quiet origin "$lease"
            author="$(git log -1 --format=%ae "$lease")"
            if [ "$author" != "$BOT_EMAIL" ]; then
              echo "::error::$BRANCH tip $lease was written by $author, not the pin bot; refusing to replace it"
              exit 1
            fi
          fi
          git config user.name "scorecard-pin[bot]"
          git config user.email "$BOT_EMAIL"
          git switch -c "$BRANCH"
          git commit -m "chore(deps): pin rat-stack to ${TO:0:7} for the scorecard" -- evals/ratstack-scorecard/ratstack.pin.json
          git push --force-with-lease="refs/heads/$BRANCH:$lease" origin "HEAD:refs/heads/$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --json number --jq '.[0].number')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore(deps): pin rat-stack to ${TO:0:7} for the scorecard" \
              --body "rat-stack \`main\` moved to \`$TO\`. This PR moves \`evals/ratstack-scorecard/ratstack.pin.json\` only; its scorecard run measures the new rat-stack. Kiro merges."
          fi
