name: Release gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: plan · mutation shards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      packages: ${{ steps.shards.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/dev-shell
        with:
          install: "false"
      - id: shards
        run: |
          nix develop --command sandbox --allow-host jsr.io -- ./scripts/mutation-shards.ts --output .cache/mutation-shards.out
          cat .cache/mutation-shards.out >> "$GITHUB_OUTPUT"

  mutation:
    name: mutation · ${{ matrix.package }}
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/dev-shell
      - name: Stryker incremental cache
        uses: actions/cache@v6
        with:
          path: |
            apps/*/reports/stryker-incremental.json
            packages/*/reports/stryker-incremental.json
          key: stryker-${{ matrix.package }}-${{ github.sha }}
          restore-keys: stryker-${{ matrix.package }}-
      - name: Mutation at break 100
        run: nix develop --command sandbox -- turbo run mutation --filter="${{ matrix.package }}"
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mutation-report-${{ strategy.job-index }}
          path: |
            apps/*/reports/mutation-report.*
            packages/*/reports/mutation-report.*
          if-no-files-found: ignore

  deploy:
    name: deploy · production
    needs: [mutation]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      worker: ${{ steps.site.outputs.worker }}
      previous_version: ${{ steps.previous.outputs.version }}
      new_version: ${{ steps.recorded.outputs.version }}
    env:
      ALCHEMY_STAGE: prod
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/dev-shell
      - name: Read the production worker before deploying
        id: prior
        run: |
          worker=""
          if out="$(nix develop --command ./bin/cloud pnpm --filter @endgame/site exec alchemy state cat --backend cloudflare "Endgame/prod/output" 2>&1)"; then
            worker="$(sed -n '/^{/,$p' <<<"$out" | jq -er '.workerName')"
          elif ! grep -q 'path does not exist' <<<"$out"; then
            echo "$out" >&2
            exit 1
          fi
          echo "worker=$worker" >> "$GITHUB_OUTPUT"
      - name: Record the version serving production now
        id: previous
        env:
          DEPLOY_WORKER: ${{ steps.prior.outputs.worker }}
        run: |
          if [ -n "$DEPLOY_WORKER" ]; then
            echo "version=$(nix develop --command ./bin/cloud node apps/site/deploy/current-worker-version.ts)" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy production
        env:
          ALCHEMY_CLOUDFLARE_API_LOG: ${{ github.workspace }}/.cache/deploy-1.jsonl
        run: nix develop --command pnpm cloud:deploy
      - name: Redeploy production to prove no settings drift
        env:
          ALCHEMY_CLOUDFLARE_API_LOG: ${{ github.workspace }}/.cache/deploy-2.jsonl
        run: nix develop --command pnpm cloud:redeploy
      - name: Read the production worker and URL
        id: site
        run: |
          state="$(nix develop --command ./bin/cloud pnpm --filter @endgame/site exec alchemy state cat --backend cloudflare "Endgame/prod/output" | sed -n '/^{/,$p')"
          echo "$state"
          worker="$(jq -er '.workerName' <<<"$state")"
          url="$(jq -er '.url' <<<"$state")"
          { echo "worker=$worker"; echo "url=$url"; } >> "$GITHUB_OUTPUT"
      - name: Check the redeploy log and Workers Issues
        env:
          DEPLOY_WORKER: ${{ steps.site.outputs.worker }}
          DEPLOY_LOG: ${{ github.workspace }}/.cache/deploy-2.jsonl
        run: nix develop --command ./bin/cloud node apps/site/deploy/verify-deployment.ts
      - name: Record the version serving production now
        id: recorded
        env:
          DEPLOY_WORKER: ${{ steps.site.outputs.worker }}
        run: echo "version=$(nix develop --command ./bin/cloud node apps/site/deploy/current-worker-version.ts)" >> "$GITHUB_OUTPUT"
      - name: Deploy summary
        run: |
          {
            echo "### Production deploy"
            echo
            echo "- version before: \`${{ steps.previous.outputs.version }}\`"
            echo "- version now: \`${{ steps.recorded.outputs.version }}\`"
            echo "- URL: ${{ steps.site.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: production-deploy-logs
          path: .cache/deploy-*.jsonl
          if-no-files-found: ignore

  qa:
    name: qa · production
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      SITE_URL: https://endgame.systemfsoftware.com
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/dev-shell
      - name: Deployed journeys
        run: nix develop --command ./bin/cloud pnpm --filter @endgame/site-e2e test:deployed
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: production-qa-artifacts
          path: apps/site-e2e/artifacts/
          if-no-files-found: ignore

  rollback:
    name: rollback · production
    needs: [deploy, qa]
    if: ${{ failure() && needs.qa.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ROLLBACK_WORKER: ${{ needs.deploy.outputs.worker }}
      ROLLBACK_FROM_VERSION: ${{ needs.deploy.outputs.new_version }}
      ROLLBACK_TO_VERSION: ${{ needs.deploy.outputs.previous_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/dev-shell
      - name: Roll production back to the recorded previous version
        if: env.ROLLBACK_TO_VERSION != ''
        run: nix develop --command ./bin/cloud pnpm --filter @endgame/site rollback
      - name: Rollback summary and red gate
        if: always()
        run: |
          {
            echo "### Production QA failed — Worker rolled back"
            echo
            echo "- failed version: \`${ROLLBACK_FROM_VERSION:-unknown}\`"
            echo "- restored version: \`${ROLLBACK_TO_VERSION:-none}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
