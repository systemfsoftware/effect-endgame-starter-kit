name: Release gate

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  plan:
    name: plan · mutation shards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/dev-shell
        with:
          install: "false"
      - id: shards
        run: |
          nix develop --command sandbox --allow-host jsr.io -- ./scripts/mutation-shards.ts --output .cache/mutation-shards.out
          cat .cache/mutation-shards.out >> "$GITHUB_OUTPUT"

  mutation:
    name: mutation · ${{ matrix.shard.package }}
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      CI: "true"
      PACKAGE: ${{ matrix.shard.package }}
      MUTATE: ${{ join(matrix.shard.mutate, ',') }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/dev-shell
      - name: Stryker incremental cache
        uses: actions/cache@v6
        with:
          path: |
            apps/*/reports/stryker-incremental.json
            packages/*/reports/stryker-incremental.json
          key: stryker-${{ matrix.shard.package }}-${{ github.sha }}
          restore-keys: stryker-${{ matrix.shard.package }}-
      - name: Mutation dependencies
        shell: bash
        run: |
          deps="$(nix develop --command pnpm exec turbo run mutation --filter="$PACKAGE" --dry=json | jq -r --arg self "$PACKAGE#mutation" '[.tasks[].taskId | select(. != $self)] | join(" ")')"
          read -ra tasks <<< "$deps"
          if [ "${#tasks[@]}" -gt 0 ]; then nix develop --command pnpm exec sandbox -- turbo run "${tasks[@]}"; fi
      - name: Mutation at break 100
        run: nix develop --command pnpm exec sandbox --pass-env GITHUB_ACTIONS -- turbo run mutation --filter="$PACKAGE" --only -- --mutate "$MUTATE"
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mutation-report-${{ strategy.job-index }}
          path: |
            apps/*/reports/mutation-report.*
            packages/*/reports/mutation-report.*
          if-no-files-found: ignore

  deploy:
    name: deploy · production
    needs: [ci, plan, mutation]
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ALCHEMY_STAGE: prod
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/cloudflare-secrets
      - uses: ./.github/actions/dev-shell
      - name: Deploy production
        run: nix develop --command pnpm run deploy
      - name: Read the production URL
        id: site
        run: |
          state="$(nix develop --command ./bin/cloud pnpm --filter @endgame/site exec alchemy state cat --backend cloudflare "Endgame/prod/output" | sed -n '/^{/,$p')"
          echo "url=$(jq -er '.url' <<<"$state")" >> "$GITHUB_OUTPUT"
