name: Release gate

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: plan · mutation shards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      packages: ${{ steps.shards.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/dev-shell
        with:
          install: "false"
      - id: shards
        run: |
          nix develop --command sandbox --allow-host jsr.io -- ./scripts/mutation-shards.ts --output .cache/mutation-shards.out
          cat .cache/mutation-shards.out >> "$GITHUB_OUTPUT"

  mutation:
    name: mutation · ${{ matrix.package }}
    needs: [plan]
    if: ${{ needs.plan.outputs.packages != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/dev-shell
      - name: Stryker incremental cache
        uses: actions/cache@v6
        with:
          path: |
            apps/*/reports/stryker-incremental.json
            packages/*/reports/stryker-incremental.json
          key: stryker-${{ matrix.package }}-${{ github.sha }}
          restore-keys: stryker-${{ matrix.package }}-
      - name: Mutation at break 100
        run: nix develop --command sandbox -- turbo run mutation --filter="${{ matrix.package }}"
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mutation-report-${{ strategy.job-index }}
          path: |
            apps/*/reports/mutation-report.*
            packages/*/reports/mutation-report.*
          if-no-files-found: ignore

  deploy:
    name: deploy · production
    needs: [plan, mutation]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.mutation.result == 'success' || needs.mutation.result == 'skipped') && !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ALCHEMY_STAGE: prod
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/cloudflare-secrets
      - uses: ./.github/actions/dev-shell
      - name: Deploy production
        run: nix develop --command pnpm run deploy
      - name: Read the production URL
        id: site
        run: |
          state="$(nix develop --command ./bin/cloud pnpm --filter @endgame/site exec alchemy state cat --backend cloudflare "Endgame/prod/output" | sed -n '/^{/,$p')"
          echo "url=$(jq -er '.url' <<<"$state")" >> "$GITHUB_OUTPUT"
