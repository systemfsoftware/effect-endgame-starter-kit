name: Changeset Check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  require-changeset:
    if: github.head_ref != 'changeset-release/main'
    name: a publishable-package change needs a changeset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/dev-shell
        with:
          install: "false"
      - name: Require a changeset for publishable-package changes
        run: nix develop --command sandbox --allow-host jsr.io -- ./scripts/check-changeset.ts ${{ github.event.pull_request.base.sha }}
