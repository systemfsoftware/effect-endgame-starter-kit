name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.leg }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: format
            runs-on: ubuntu-latest
            gate: pnpm format:check
          - leg: lint
            runs-on: ubuntu-latest
            gate: pnpm lint
          - leg: typecheck
            runs-on: ubuntu-latest
            gate: pnpm typecheck
          - leg: test
            runs-on: ubuntu-latest
            gate: pnpm test
          - leg: dist
            runs-on: ubuntu-latest
            gate: pnpm gate:dist
          - leg: sfs-sources
            runs-on: ubuntu-latest
            gate: pnpm check:sfs-sources
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45
    env:
      CI: "true"
      OXLINT_FORMAT: github
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/dev-shell
      - name: Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-dist-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-dist-
            turbo-${{ runner.os }}-
      - name: Gate
        run: nix develop --command ${{ matrix.gate }}

  journeys:
    name: journeys
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/dev-shell
      - name: Journeys against pnpm dev
        run: nix develop --command pnpm journeys
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: journeys
          path: |
            apps/site-e2e/artifacts/
            .journeys/dev.log
          if-no-files-found: ignore

  rules:
    name: rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/dev-shell
      - name: Main's active rules require every pull-request check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: nix develop --command pnpm check:branch-rules
