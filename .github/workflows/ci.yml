name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.leg }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: format
            runs-on: ubuntu-latest
            gate: pnpm format:check
          - leg: lint
            runs-on: ubuntu-latest
            gate: pnpm lint
          - leg: typecheck
            runs-on: ubuntu-latest
            gate: pnpm typecheck
          - leg: test
            runs-on: ubuntu-latest
            gate: pnpm test
          - leg: dist
            runs-on: ubuntu-latest
            gate: pnpm gate:dist
          - leg: sfs-sources
            runs-on: ubuntu-latest
            gate: pnpm check:sfs-sources
          - leg: local-stack
            runs-on: ubuntu-latest
            gate: pnpm check:ci-run
          - leg: macos
            runs-on: macos-latest
            gate: pnpm check:ci
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45
    env:
      CI: "true"
      OXLINT_FORMAT: github
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/dev-shell
      - name: Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-dist-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-dist-
            turbo-${{ runner.os }}-
      - name: Gate
        run: nix develop --command ${{ matrix.gate }}

  stack:
    name: stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/dev-shell
      - name: Local stack journeys
        run: nix develop --command pnpm stack:ci
      - name: Local stack report
        if: failure() && hashFiles('local-stack/data/stack-report.md') != ''
        run: cat local-stack/data/stack-report.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: stack-artifacts
          path: |
            apps/site-e2e/artifacts/
            local-stack/data/process-compose.log
            local-stack/data/stack-report.md
          if-no-files-found: ignore
