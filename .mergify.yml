extends: .github
queue_rules:
  - name: subtree
    merge_method: merge
    queue_conditions:
      # Org convention (systemfsoftware/.github README, "Subtree PRs"): one commit
      # carries both trailers, and the PR history is not linear.
      - 'commits[*].commit_message ~= (?ms)\A(?=.*^git-subtree-dir: \S+$)(?=.*^git-subtree-split: [0-9a-f]{40}$)'
      - -linear-history
      - check-success = checks / check
    merge_conditions:
      - check-success = checks / check

  - name: default
    queue_conditions:
      # Subtree PRs merge via the subtree queue above; a subtree
      # claim without trailers matches no queue and cannot merge at all.
      - "-commits[*].commit_message ~= (?m)^git-subtree-dir: \\S+$"
      - "-title ~= (?i)\\b(add|pull|update|sync|vendor|refresh|import)\\b[^.]*\\bsubtrees?\\b|\\bsubtrees?\\b[^.]*(\\badd\\b|\\bpull\\b|\\bupdate\\b|\\bsync\\b|\\bvendor\\b|\\brefresh\\b|\\bimport\\b)"
      # Vendored subtree prefixes in this repo: hand edits without trailers cannot merge.
      - not:
          or:
            - "added-files ~= ^(repos/alchemy|repos/constitution|repos/effect|repos/worktrunk-scripts)/"
            - "modified-files ~= ^(repos/alchemy|repos/constitution|repos/effect|repos/worktrunk-scripts)/"
      - check-success = checks / check
    merge_conditions:
      - check-success = checks / check
