[server]
http_addr = 127.0.0.1
http_port = 3000

[auth.anonymous]
enabled = true
org_role = Admin

[auth]
disable_login_form = true

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

# Grafana's built-in preinstall list (grafana-pyroscope-app,
# grafana-exploretraces-app) downloads unpinned zips from grafana.com on every
# fresh data dir. Nothing needs them: the Tempo data source is provisioned from
# a file and Explore renders traces from core Grafana. Keep the stack offline.
[plugins]
preinstall_disabled = true
